document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 Sans Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"666440f3-3a3a-4a2c-8ee0-75f121f0f711\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spline Sans Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"88aa6ba3-889c-46a4-bbc3-99ea458ce68f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Spline Sans Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"666440f3-3a3a-4a2c-8ee0-75f121f0f711\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spline Sans Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"88aa6ba3-889c-46a4-bbc3-99ea458ce68f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ════════════════════════════════════════════════\n   RODA — Tema \"Oficina Calorosa\"\n   Tokens, base, moldura do telefone, navegação\n   ════════════════════════════════════════════════ */\n\n:root{\n  /* Light (default) — warm paper & wood */\n  --paper:#F4EEE3;\n  --surface:#FFFCF6;\n  --surface-2:#EFE7D8;\n  --surface-3:#E7DCC9;\n  --ink:#2C2620;\n  --ink-2:#6E6557;\n  --ink-3:#A89C88;\n  --line:rgba(44,38,32,.10);\n  --line-2:rgba(44,38,32,.16);\n\n  /* Accents */\n  --clay:#C25C3A;          /* terracotta — primary action / energy */\n  --clay-press:#A94A2C;\n  --clay-soft:rgba(194,92,58,.12);\n  --clay-line:rgba(194,92,58,.30);\n  --sage:#4E8C68;          /* green — \"afinado / certo\" */\n  --sage-soft:rgba(78,140,104,.14);\n  --ochre:#B5862E;         /* amber — médio */\n  --ochre-soft:rgba(181,134,46,.15);\n\n  /* difficulty */\n  --d-easy:#4E8C68;  --d-easy-bg:rgba(78,140,104,.14);\n  --d-med:#B5862E;   --d-med-bg:rgba(181,134,46,.16);\n  --d-hard:#C25C3A;  --d-hard-bg:rgba(194,92,58,.14);\n\n  --r-lg:26px; --r:18px; --r-sm:12px; --r-xs:8px;\n  --shadow-card:0 1px 2px rgba(44,38,32,.04),0 8px 24px rgba(44,38,32,.06);\n  --shadow-pop:0 12px 40px rgba(44,38,32,.16);\n\n  --ff-display:'Bricolage Grotesque',sans-serif;\n  --ff-body:'Hanken Grotesk',sans-serif;\n  --ff-mono:'Spline Sans Mono',monospace;\n\n  --nav-h:78px;\n}\n\n[data-theme=\"dark\"]{\n  --paper:#191512;\n  --surface:#221D18;\n  --surface-2:#2B251E;\n  --surface-3:#352D24;\n  --ink:#F1E8D8;\n  --ink-2:#B7AB97;\n  --ink-3:#7E7464;\n  --line:rgba(255,250,240,.09);\n  --line-2:rgba(255,250,240,.15);\n  --clay:#E07A52;\n  --clay-press:#C96440;\n  --clay-soft:rgba(224,122,82,.16);\n  --clay-line:rgba(224,122,82,.34);\n  --sage:#6CB089;\n  --sage-soft:rgba(108,176,137,.16);\n  --ochre:#D6A845;\n  --ochre-soft:rgba(214,168,69,.16);\n  --d-easy:#6CB089; --d-easy-bg:rgba(108,176,137,.16);\n  --d-med:#D6A845;  --d-med-bg:rgba(214,168,69,.16);\n  --d-hard:#E07A52; --d-hard-bg:rgba(224,122,82,.16);\n  --shadow-card:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);\n  --shadow-pop:0 16px 48px rgba(0,0,0,.5);\n}\n\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}\nhtml,body{height:100%}\nbutton{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}\ninput,select,textarea{font-family:inherit;color:inherit}\na{color:inherit;text-decoration:none}\nimg{display:block;max-width:100%}\n\n/* ── STAGE: warm backdrop the phone sits on ── */\nbody{\n  font-family:var(--ff-body);\n  background:\n    radial-gradient(120% 90% at 50% -10%, #efe6d6 0%, #ddd1bd 55%, #cbbda4 100%);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  overflow:hidden;\n}\n#stage{\n  position:fixed;inset:0;display:flex;align-items:stretch;justify-content:center;\n  background:\n    radial-gradient(120% 90% at 50% -10%, #efe6d6 0%, #ddd1bd 55%, #cbbda4 100%);\n}\n[data-theme=\"dark\"] #stage{\n  background:radial-gradient(120% 90% at 50% -10%, #221d18 0%, #15110d 60%, #0d0a07 100%);\n}\n\n/* ── APP SHELL: mobile-first, responsive ── */\n#phone{\n  position:relative;width:100%;max-width:480px;height:100%;flex-shrink:0;\n}\n.bezel{display:none;}\n.screen{\n  position:absolute;inset:0;overflow:hidden;\n  background:var(--paper);display:flex;flex-direction:column;\n}\n/* soft edges + shadow only when there's room beside the column */\n@media (min-width:520px){\n  #phone{height:100%;}\n  .screen{box-shadow:0 0 0 1px var(--line),0 30px 80px -40px rgba(40,30,18,.5);}\n}\n.statusbar{display:none;}\n.notch{display:none;}\n\n/* ── APP HEADER (in-screen) ── */\n.appbar{\n  flex-shrink:0;display:flex;align-items:center;gap:10px;\n  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;position:relative;z-index:20;\n}\n.appbar .wordmark{font-family:var(--ff-display);font-weight:800;font-size:24px;letter-spacing:-.5px;color:var(--ink);display:flex;align-items:center;gap:1px}\n.appbar .wordmark .o-strings{display:inline-flex;align-items:center;justify-content:center;margin:0 1px;color:var(--ink);position:relative;top:1px}\n.appbar .wordmark .o-strings svg{display:block}\n.appbar .spacer{flex:1}\n.ibtn{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);transition:.18s;position:relative;box-shadow:var(--shadow-card)}\n.ibtn:active{transform:scale(.92)}\n.ibtn .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--clay);border:2px solid var(--surface);display:none}\n.ibtn .dot.on{display:block}\n\n/* ── VIEWPORT (scroll) ── */\n.viewport{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;scrollbar-width:none}\n.viewport::-webkit-scrollbar{display:none}\n.page{display:none;padding-bottom:calc(var(--nav-h) + 28px);opacity:1}\n.page.active{display:block}\n@keyframes pgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}\n\n/* ── BOTTOM NAV ── */\n.bottomnav{\n  position:absolute;left:0;right:0;bottom:0;min-height:var(--nav-h);z-index:40;\n  background:linear-gradient(to top,var(--paper) 62%,transparent);\n  display:flex;align-items:flex-start;justify-content:space-between;\n  padding:10px 18px env(safe-area-inset-bottom,0px);\n}\n.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-3);font-size:10.5px;font-weight:600;letter-spacing:.2px;padding-top:8px;transition:color .18s;background:none}\n.nav-btn svg{transition:transform .2s}\n.nav-btn.active{color:var(--clay)}\n.nav-btn.active svg{transform:translateY(-1px)}\n.nav-fab-slot{width:74px;flex:0 0 74px;display:flex;justify-content:center;position:relative}\n.nav-fab{position:absolute;top:-20px;width:62px;height:62px;border-radius:50%;\n  background:linear-gradient(155deg,var(--clay),var(--clay-press));color:#fff;\n  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;\n  box-shadow:0 8px 22px -4px var(--clay-line),0 2px 0 rgba(255,255,255,.25) inset;\n  transition:.2s;border:4px solid var(--paper)}\n.nav-fab span{font-size:8.5px;font-weight:700;letter-spacing:.4px;margin-top:1px}\n.nav-fab:active{transform:scale(.93)}\n.nav-fab.active{box-shadow:0 0 0 4px var(--clay-soft),0 8px 24px -2px var(--clay-line)}\n\n/* ── shared bits ── */\n.toast{position:absolute;left:50%;bottom:calc(var(--nav-h) + 14px);transform:translateX(-50%) translateY(14px);\n  background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 18px;font-size:13px;font-weight:600;\n  z-index:90;opacity:0;transition:.28s;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow-pop);max-width:88%}\n.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}\n\n.scrim{position:absolute;inset:0;background:rgba(20,15,10,.4);z-index:60;opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(2px)}\n.scrim.show{opacity:1;pointer-events:auto}\n<\u002Fstyle>\n<style>/* ════════════════════════════════════════════════\n   RODA — Estilos de tela e componentes\n   ════════════════════════════════════════════════ */\n\n/* ── section header ── */\n.sec{display:flex;align-items:center;justify-content:space-between;padding:22px 20px 12px}\n.sec h2{font-family:var(--ff-display);font-weight:700;font-size:19px;letter-spacing:-.4px;color:var(--ink)}\n.sec .sub{font-size:12px;color:var(--ink-3);font-weight:500}\n.sec .link{font-size:12.5px;font-weight:700;color:var(--clay)}\n.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3)}\n\n/* ── GREETING / HOME ── */\n.greet{padding:8px 20px 4px}\n.greet .hi{font-family:var(--ff-display);font-weight:700;font-size:26px;letter-spacing:-.6px;line-height:1.15}\n.greet .hi em{font-style:normal;color:var(--clay)}\n.greet .date{font-size:13px;color:var(--ink-2);margin-top:3px;font-weight:500}\n\n/* streak / practice strip */\n.streak{margin:14px 20px 0;display:flex;gap:10px}\n.streak-card{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow-card)}\n.streak-card .n{font-family:var(--ff-display);font-weight:700;font-size:24px;line-height:1;color:var(--ink)}\n.streak-card .n small{font-size:13px;color:var(--ink-3);font-weight:600;margin-left:2px}\n.streak-card .l{font-size:11px;color:var(--ink-2);margin-top:4px;font-weight:600}\n.streak-card .dots{display:flex;gap:4px;margin-top:9px}\n.streak-card .dots i{width:100%;height:6px;border-radius:3px;background:var(--surface-3)}\n.streak-card .dots i.f{background:var(--clay)}\n\n/* continue card (big) */\n.continue{margin:16px 20px 0;border-radius:var(--r-lg);overflow:hidden;position:relative;\n  background:linear-gradient(135deg,#37302a,#241f1a);color:#F1E8D8;padding:20px;box-shadow:var(--shadow-pop)}\n[data-theme=\"dark\"] .continue{background:linear-gradient(135deg,#322a22,#1d1813);border:1px solid var(--line)}\n.continue::after{content:\"\";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;\n  background:radial-gradient(circle,var(--clay-soft),transparent 70%)}\n.continue .tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--clay);background:rgba(224,122,82,.16);padding:5px 11px;border-radius:999px}\n.continue h3{font-family:var(--ff-display);font-weight:700;font-size:22px;margin-top:13px;letter-spacing:-.4px;position:relative}\n.continue .art{font-size:13.5px;opacity:.7;margin-top:2px;position:relative}\n.continue .prog{height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:16px;overflow:hidden;position:relative}\n.continue .prog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--clay),#e8a06f)}\n.continue .row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;position:relative}\n.continue .row span{font-size:12px;opacity:.7;font-weight:600}\n.continue .play{width:46px;height:46px;border-radius:50%;background:var(--clay);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -4px rgba(224,122,82,.6)}\n\n/* ── SONG ROW ── */\n.song-list{padding:2px 12px}\n.song{display:flex;align-items:center;gap:13px;padding:11px 10px;border-radius:var(--r);transition:background .14s}\n.song:active{background:var(--surface-2)}\n.thumb{width:54px;height:54px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;\n  font-family:var(--ff-display);font-weight:700;font-size:18px;color:#fff;position:relative;overflow:hidden}\n.thumb::after{content:\"\";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 55%)}\n.song .info{flex:1;min-width:0}\n.song .nm{font-weight:700;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}\n.song .ar{font-size:12.5px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.song .meta{display:flex;align-items:center;gap:6px;margin-top:6px}\n.pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.2px;white-space:nowrap}\n.pill.easy{color:var(--d-easy);background:var(--d-easy-bg)}\n.pill.med{color:var(--d-med);background:var(--d-med-bg)}\n.pill.hard{color:var(--d-hard);background:var(--d-hard-bg)}\n.pill.ghost{color:var(--ink-2);background:var(--surface-2)}\n.song .chords{display:flex;gap:4px;flex-shrink:0}\n.song .ch{min-width:26px;height:26px;padding:0 4px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);\n  display:flex;align-items:center;justify-content:center;font-family:var(--ff-mono);font-size:11px;font-weight:600;color:var(--ink-2)}\n\n/* ── CHIPS ── */\n.chips{display:flex;gap:8px;padding:4px 20px 10px;overflow-x:auto;scrollbar-width:none}\n.chips::-webkit-scrollbar{display:none}\n.chip{flex-shrink:0;padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;\n  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);transition:.16s;white-space:nowrap}\n.chip:active{transform:scale(.95)}\n.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}\n.chip.acc.on{background:var(--clay);border-color:var(--clay);color:#fff}\n\n/* ── ACORDE DO DIA ── */\n.daychord{margin:0 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);\n  padding:18px;display:flex;gap:16px;align-items:center;box-shadow:var(--shadow-card)}\n.daychord .diag-wrap{flex-shrink:0;background:var(--surface-2);border-radius:var(--r);padding:8px}\n.daychord .meta{flex:1;min-width:0}\n.daychord .eyebrow{margin-bottom:4px}\n.daychord .cn{font-family:var(--ff-display);font-weight:700;font-size:30px;letter-spacing:-1px;line-height:1;color:var(--clay)}\n.daychord .cf{font-size:13px;color:var(--ink-2);font-weight:600;margin-top:2px}\n.daychord .tip{font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.5}\n\n/* ── empty state ── */\n.empty{text-align:center;padding:60px 30px;color:var(--ink-3)}\n.empty .ic{width:64px;height:64px;border-radius:20px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--ink-3)}\n.empty h3{font-family:var(--ff-display);font-weight:700;font-size:17px;color:var(--ink-2);margin-bottom:6px}\n.empty p{font-size:13.5px;line-height:1.55;max-width:240px;margin:0 auto}\n\n/* ════════════════════════════════════════════════\n   CIFRA (song detail)\n   ════════════════════════════════════════════════ */\n.detail-top{display:flex;align-items:center;gap:6px;padding:4px 14px 6px}\n.back{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:var(--ink-2);padding:8px 6px}\n.detail-top .spacer{flex:1}\n.sd-hero{padding:6px 20px 14px;display:flex;gap:15px;align-items:flex-start}\n.sd-hero .thumb{width:68px;height:68px;border-radius:18px;font-size:22px}\n.sd-hero .info h1{font-family:var(--ff-display);font-weight:700;font-size:22px;letter-spacing:-.5px;line-height:1.12;color:var(--ink)}\n.sd-hero .info .ar{font-size:14px;color:var(--ink-2);margin-top:3px;font-weight:500}\n.sd-hero .info .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}\n\n/* segmented tabs */\n.segs{display:flex;gap:4px;margin:0 20px 4px;background:var(--surface-2);border-radius:14px;padding:4px}\n.seg{flex:1;text-align:center;padding:9px 6px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink-2);transition:.18s}\n.seg.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-card)}\n\n.tabpane{display:none;opacity:1}\n.tabpane.on{display:block}\n\n/* cifra reading */\n.cifra-tools{display:flex;align-items:center;gap:8px;padding:12px 20px 6px;flex-wrap:wrap}\n\n/* ── cifra control panel (sticky, above lyrics) ── */\n.cifra-ctrl{position:sticky;top:0;z-index:16;background:var(--paper);\n  padding:10px 16px 12px;border-bottom:1px solid var(--line);\n  display:flex;flex-direction:column;gap:9px;box-shadow:0 6px 16px -10px rgba(44,38,32,.4)}\n.cc-tools{display:flex;gap:8px}\n.cc-row{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px;box-shadow:var(--shadow-card)}\n.cc-play{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--clay);color:#fff;box-shadow:0 4px 12px -3px var(--clay-line);transition:transform .12s}\n.cc-play.alt{background:var(--surface-2);color:var(--ink-2);box-shadow:none}\n.cc-play.alt.on{background:var(--ink);color:var(--paper)}\n.cc-play.on{background:var(--clay-press)}\n.cc-play:active{transform:scale(.9)}\n.cc-mid{flex:1;min-width:0}\n.cc-lab{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--ink-2)}\n.cc-lab b{color:var(--clay);font-family:var(--ff-mono);font-size:12px}\n.cc-row input[type=range]{width:100%;margin-top:9px}\n.mbeats{display:flex;gap:5px;align-items:center}\n.mbeats i{width:8px;height:8px;border-radius:50%;background:var(--surface-3);transition:.08s}\n.mbeats i.db{box-shadow:inset 0 0 0 1.4px var(--clay-line);background:var(--clay-soft)}\n.mbeats i.on{background:var(--clay);transform:scale(1.45)}\n.mbeats i.db.on{background:var(--clay);box-shadow:0 0 10px var(--clay-line)}\n.bpm-step{display:flex;align-items:center;gap:8px;margin-top:8px}\n.bpm-step>button{width:32px;height:32px;border-radius:10px;background:var(--surface-2);font-size:18px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}\n.bpm-step>button:active{transform:scale(.9)}\n.bpm-v{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--ink-2)}\n.bpm-v b{font-family:var(--ff-display);font-size:20px;font-weight:700;color:var(--ink)}\n.bpm-click{width:32px;height:32px;border-radius:10px;background:var(--surface-2);color:var(--ink-3);display:flex;align-items:center;justify-content:center;flex-shrink:0}\n.bpm-click.on{background:var(--clay-soft);color:var(--clay)}\n\n/* feature card chord chips */\n.feat-chords{display:flex;gap:6px;margin-top:13px;position:relative;flex-wrap:wrap}\n.feat-chords span{font-family:var(--ff-mono);font-size:12px;font-weight:600;color:#F1E8D8;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:4px 10px}\n\n/* home hint card */\n.hint-card{margin:2px 20px 0;display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow-card)}\n.hint-card .hc-ic{width:44px;height:44px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--clay-soft);color:var(--clay)}\n.hint-card div{flex:1;display:flex;flex-direction:column;gap:2px}\n.hint-card b{font-size:14.5px;font-weight:700;color:var(--ink);letter-spacing:-.2px}\n.hint-card span{font-size:12.5px;color:var(--ink-2)}\n.tool{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2);box-shadow:var(--shadow-card)}\n.tool .lbl{color:var(--ink-3);font-weight:600}\n.tool .val{font-family:
